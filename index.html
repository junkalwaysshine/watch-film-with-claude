<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch a film with Claude</title>
<meta name="description" content="How an AI agent watched a whole film together with a person: method, every page of the viewing, and what it felt like. Choose any language.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-light.css">
<style>
  :root { --bg:#f6f8fa; --card:#ffffff; --line:#d0d7de; --ink:#1f2328; --muted:#59636e; }
  body { background:var(--bg); color:var(--ink); margin:0; font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  .top { position:sticky; top:0; z-index:10; background:#24292f; color:#fff; padding:10px 16px;
         display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  .top a { color:#fff; }
  .lang { display:flex; gap:8px; align-items:center; font-size:14px; }
  .box { max-width:1012px; margin:24px auto; background:var(--card); border:1px solid var(--line); border-radius:6px; }
  .markdown-body { padding:32px; box-sizing:border-box; }
  .note { color:var(--muted); font-size:13px; padding:8px 32px 0; }
  @media (max-width:767px) { .box { margin:0; border-radius:0; } .markdown-body { padding:16px; } .note { padding:8px 16px 0; } }
  .goog-te-banner-frame { display:none !important; } body { top:0 !important; }
</style>
</head>
<body>
<div class="top">
  <div><a href="https://github.com/junkalwaysshine/watch-film-with-claude">github.com/junkalwaysshine/watch-film-with-claude</a></div>
  <div class="lang">🌍 <span>Language / Язык:</span> <div id="google_translate_element"></div></div>
</div>
<div class="box">
  <div class="note">Original in Russian. Pick your language at the top. The whole page, including every chat message and footnote, will be machine-translated (~240 languages). A careful English translation is in <a href="https://github.com/junkalwaysshine/watch-film-with-claude/blob/main/README.en.md">README.en.md</a>.</div>
  <article class="markdown-body" id="c">Loading…</article>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-footnote@1.2.2/dist/index.umd.min.js"></script>
<script>
  marked.use(markedFootnote());
  fetch('README.md').then(r => r.text()).then(md => {
    document.getElementById('c').innerHTML = marked.parse(md);
  }).catch(() => {
    document.getElementById('c').innerHTML = '<p>Could not load README.md. Open it on <a href="https://github.com/junkalwaysshine/watch-film-with-claude">GitHub</a>.</p>';
  });
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({ pageLanguage: 'ru', layout: google.translate.TranslateElement.InlineLayout.SIMPLE }, 'google_translate_element');
  }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
